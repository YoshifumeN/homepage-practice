name: Update citation counts

on:
  workflow_dispatch:

  schedule:
    - cron: "0 12 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update citation counts
        run: python scripts/update_citations.py

      - name: Commit updated citation data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add publications.html data/citations.json

          if git diff --cached --quiet; then
            echo "No citation changes."
          else
            git commit -m "Update citation counts"
            git push
          fi
